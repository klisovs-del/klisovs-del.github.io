<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація на курс</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <header class="header">
        <!-- Кнопка повернення (Пункт 5) -->
        <a href="index.html" class="back-button">⬅ На вибір академії</a>
        <h1>Реєстрація на курс</h1>
    </header>

    <main class="container">
        <form class="registration-form" action="#" method="POST">
            <div class="form-group">
                <label for="name">ПІБ:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="course">Оберіть курс:</label>
                <select id="course" name="course">
                    <option value="ccna">CCNA: Introduction to Networks</option>
                    <option value="cyberops">CyberOps Associate</option>
                    <option value="python">Python Essentials</option>
                </select>
            </div>
            <button type="submit" class="submit-btn">Зареєструватися</button>
        </form>
    </main>
</body>
</html>
