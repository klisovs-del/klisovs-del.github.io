<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Академія в розробці — ITS Network Academies</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%2711%27 fill=%27%2300BCEB%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
<style>
  .soon-wrap{
    min-height: 100svh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding: 40px 24px;
  }
  .ring{
    width: 120px; height:120px; border-radius: 50%;
    border: 1.5px dashed var(--line-strong);
    display:flex; align-items:center; justify-content:center;
    margin-bottom: 30px; position:relative;
  }
  .ring::before{
    content:""; position:absolute; inset:-1.5px; border-radius:50%;
    border: 1.5px solid transparent; border-top-color: var(--cisco);
    animation: spin 3.4s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .ring svg{ width:44px; height:44px; opacity:.7; }
  .soon-wrap h1{ font-size: clamp(26px,4vw,40px); margin-bottom: 14px; }
  .soon-wrap p{ color: var(--text-dim); max-width: 480px; margin: 0 auto 30px; }
  .back{ display:inline-flex; }
</style>
</head>
<body>
  <div class="wrap soon-wrap">
    <div class="eyebrow" id="eyebrow" style="margin-bottom:22px"><span class="dot" style="background:var(--warn)"></span> ВУЗОЛ У РОЗГОРТАННІ</div>
    <div class="ring">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9" stroke="white" stroke-width="1.4"/><path d="M12 7v5l3 3" stroke="white" stroke-width="1.4" stroke-linecap="round"/></svg>
    </div>
    <h1 id="title">Ця академія ще налаштовується</h1>
    <p id="desc">Ми готуємо програму, курси та інструкторів. Слідкуйте за оновленнями — вузол з’явиться в мережі найближчим часом.</p>
    <a class="btn btn-ghost back" href="index.html">← Повернутися до вибору академії</a>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const a = params.get('a');
    if (a === 'huawei') {
      document.title = 'Huawei ICT Academy (у розробці) — ITS Network Academies';
      document.getElementById('title').textContent = 'Huawei ICT Academy готується до запуску';
      document.getElementById('desc').textContent = 'Ми узгоджуємо навчальну програму HCIA/HCIP та реєструємо академію в партнерській мережі Huawei. Дані про набір з’являться тут.';
    }
  </script>
  <script src="assets/script.js"></script>
</body>
</html>
